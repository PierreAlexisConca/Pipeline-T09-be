name: Docker Hub

on:
  push:
    branches:
      - develop
      - webflux-nosql # puedes añadir más ramas
  pull_request:
    branches:
      - develop
      - webflux-nosql # puedes añadir más ramas
  schedule:
    # Ejecutar todos los días a las 8:00 AM hora Perú (UTC-5) → 1:00 PM UTC
    - cron: '0 13 * * *'
  workflow_dispatch:  # Permite ejecución manual desde GitHub Actions UI

jobs:
  dockerhub:
    name: Build and Push Docker Image
    runs-on: ubuntu-latest
    steps:
      # 1. Checkout del código
      - name: Checkout Repository
        uses: actions/checkout@v4

      # 2. Convertir username a minúsculas (Docker Hub lo requiere)
      - name: Set lowercase username
        id: vars
        run: echo "username=$(echo '${{ secrets.DOCKERHUB_USERNAME_PIERRE }}' | tr '[:upper:]' '[:lower:]')" >> $GITHUB_OUTPUT

      # 3. Login a Docker Hub
      - name: Log in to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKERHUB_USERNAME_PIERRE }}
          password: ${{ secrets.DOCKERHUB_TOKEN_PIERRE }}

      # 4. Build y Push con tags latest y SHA
      - name: Build and Push Docker Image to Docker Hub
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./dockerfile-concaflores/Dockerfile
          push: true
          tags: |
            ${{ steps.vars.outputs.username }}/pipeline-t09-be:latest
            ${{ steps.vars.outputs.username }}/pipeline-t09-be:${{ github.sha }}